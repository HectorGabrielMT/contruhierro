{% extends "granja/base.html" %}
{% load static %}
{% block title %}Iniciar sesión | Contru hierro{% endblock %}
{% block auth_content %}
<div class="grid w-full max-w-4xl overflow-hidden rounded-3xl bg-white shadow-2xl md:grid-cols-2">
    <section class="relative hidden min-h-[28rem] md:block">
        <img src="{% static 'granja/img/cochino-banner.jpg' %}" alt="Cochino rosado en la granja" class="absolute inset-0 h-full w-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-navy-900/80 via-navy-900/10 to-transparent"></div>
        <div class="absolute bottom-0 left-0 flex items-center gap-3 p-8">
            <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-white/95"><img src="{% static 'granja/img/cochino-icon.svg' %}" alt="" class="h-9 w-9"></span>
            <span class="text-xl font-semibold tracking-tight text-white">Contru hierro</span>
        </div>
    </section>
    <section class="p-8 sm:p-12">
        <div class="mb-8 flex items-center gap-3 md:hidden">
            <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-navy-800"><img src="{% static 'granja/img/cochino-icon.svg' %}" alt="" class="h-9 w-9"></span>
            <span class="text-xl font-semibold tracking-tight text-slate-900">Contru hierro</span>
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Iniciar sesión</h1>
        <p class="mt-1 text-sm text-slate-400">Ingresa tu usuario y contraseña.</p>
        <form method="post" class="mt-8 space-y-5">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div><label for="username" class="label">Usuario</label><input id="username" name="username" type="text" autocomplete="username" required autofocus class="input" placeholder="Usuario"></div>
            <div><label for="password" class="label">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required class="input" placeholder="Contraseña"></div>
            <button type="submit" class="btn btn-primary w-full py-3">Entrar</button>
        </form>
    </section>
</div>
{% endblock %}
